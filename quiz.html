<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norsk Artsquiz</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef5ee;
    margin:20px;
    color:#222;
}

h1{
    text-align:center;
}

.quiz{
    background:white;
    padding:20px;
    margin-bottom:25px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.question{
    margin-bottom:25px;
    padding-bottom:20px;
    border-bottom:1px solid #ddd;
}

.question img{
    width:300px;
    max-width:100%;
    border-radius:8px;
    margin-bottom:10px;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>🌿 Norsk Artsquiz</h1>

<div id="quiz-container"></div>

<script>

const quizzes = {

],

"🐝 Insekter og småkryp": [

],

};

function shuffle(array){
    return [...array].sort(() => Math.random() - 0.5);
}

const container = document.getElementById("quiz-container");

for(const [category, species] of Object.entries(quizzes)){

    const section = document.createElement("div");
    section.className = "quiz";

    section.innerHTML = `<h2>${category}</h2>`;

    species.forEach((correctAnswer,index)=>{

        let alternatives =
            shuffle(species.filter(x => x !== correctAnswer))
            .slice(0,3);

        alternatives.push(correctAnswer);
        alternatives = shuffle(alternatives);

        const id = category.replace(/\W/g,'') + index;

     let html = `
<div class="question">
    <img src="${imageMap[correctAnswer]}" ong>Hvilken art er dette?</strong></p>
`;

        alternatives.forEach(option => {
            html += `
            <label>
                <input type="radio" name="${id}" value="${option}">
                ${option}
            </label><br>
            `;
        });

        html += `<div id="result-${id}"></div>`;
        html += `</div>`;

        section.innerHTML += html;
    });

    const button = document.createElement("button");
    button.textContent = "Rett quiz";

    button.onclick = () => {

        const questions = section.querySelectorAll(".question");

        questions.forEach((question, index) => {

            const correctAnswer = species[index];

            const selected =
                question.querySelector("input[type='radio']:checked");

            const result =
                question.querySelector("div[id^='result-']");

            if(selected &&
               selected.value === correctAnswer){

                result.innerHTML =
                "<span class='correct'>✅ Riktig!</span>";

            } else {

                result.innerHTML =
                "<span class='wrong'>❌ Riktig svar: "
                + correctAnswer +
                "</span>";
            }

        });

    };

    section.appendChild(button);
    container.appendChild(section);
}

</script>
